[project]
name = "truthlens-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "feedparser>=6.0,<7.0",
    "slowapi>=0.1.9,<1.0",
    "pymongo>=4.10,<5.0",
    "dnspython>=2.7,<3.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.vercel.fastapi.static]
exclude = true
